# Checks every pull request: the game must type-check and build, and the
# Python pipeline must at least compile. Nothing is published from here.
name: Comprova

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compila:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No credentials (history and files)
        run: |
          python3 tools/secret_scan.py
          python3 tools/secret_scan.py --tree .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python pipeline syntax
        run: python -m compileall -q scripts tools
